name: Build Q1 rushing dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/build-q1-rushing.yml'
  schedule:
    - cron: '30 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and validate Q1 rushing dataset
        run: python src/build_q1_rushing_dataset_v2.py

      - name: Backtest v0.4 RB scoring formula
        run: python src/backtest_v04_scoring.py

      - name: Build current 2026 RB depth-chart snapshot
        run: python src/build_2026_rb_depth_chart.py

      - name: Build compact RB model inputs
        run: python src/build_rb_model_inputs.py

      - name: Build compact Excel exports
        run: python src/build_excel_exports.py

      - name: Print reconciliation diagnostics on failure
        if: failure()
        run: python src/debug_q1_discrepancies.py

      - name: Commit validated outputs
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- data/processed)" ]; then
            echo 'No processed data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed
          git commit -m 'Update validated Q1 rushing and v0.4 backtest outputs'
          git push

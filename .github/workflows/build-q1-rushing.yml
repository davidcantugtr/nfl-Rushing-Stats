name: Build Q1 rushing dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and validate Q1 rushing dataset
        run: python src/build_q1_rushing_dataset.py

      - name: Commit validated outputs
        run: |
          if git diff --quiet -- data/processed; then
            echo 'No processed data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed
          git commit -m 'Update validated 2025 Q1 rushing outputs'
          git push
